# coturn configuration for uwuPromptr's remote control.
#
# Copy to /etc/turnserver.conf on the VPS and edit the four marked lines.
# See README.md beside this file for the whole procedure.

# ---------------------------------------------------------------------------
# Addresses
# ---------------------------------------------------------------------------

# The VPS's own public IP. On a provider that gives the machine a private
# address and NATs it (AWS, GCP, some others), set both: external-ip is what
# coturn tells peers to contact, listening-ip is what it binds to.
#   external-ip=203.0.113.10/10.0.0.5
# EDIT: the public IP of this machine.
external-ip=YOUR_PUBLIC_IP

listening-port=3478
tls-listening-port=5349

# Relay traffic goes out on these. The range has to be open in the firewall,
# and it is deliberately small: one port is used per relayed connection, and
# this prompter will never have many at once.
min-port=49160
max-port=49200

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# The REST scheme, which is what lets credentials be short-lived. The Vercel
# function at main-site/api/turn-credentials.js signs
#   username   <unix expiry>:uwupromptr
#   credential base64(HMAC-SHA1(static-auth-secret, username))
# and coturn checks the signature and the expiry without needing any user
# accounts of its own. No long-lived password ever reaches a browser.
use-auth-secret

# EDIT: a long random string. Generate one with:
#   openssl rand -hex 32
# The same value goes in Vercel as TURN_SECRET. Treat it as a password:
# anybody who has it can mint credentials and relay traffic through this
# machine at your expense.
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING

# The hostname clients connect to. Must match TURN_HOST in Vercel.
realm=turn.cue.uwuapps.org

# ---------------------------------------------------------------------------
# TLS, for the turns: endpoint on 5349
# ---------------------------------------------------------------------------
#
# The one that gets through a restrictive network, because it looks like any
# other outbound TLS connection. Point these at a certificate for the realm
# above; certbot's live directory is the usual place.
#
# EDIT both, or comment them out to run without TLS. Without them turns: will
# not work and the udp and tcp endpoints on 3478 still will.
cert=/etc/letsencrypt/live/turn.cue.uwuapps.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.cue.uwuapps.org/privkey.pem

# Modern ciphers only.
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM"
no-tlsv1
no-tlsv1_1

# ---------------------------------------------------------------------------
# Hardening
# ---------------------------------------------------------------------------
#
# A TURN server is an open relay if it is left that way, and the usual abuse is
# somebody using it to reach things they should not.

# Refuse to relay to private ranges and to loopback. Without these, anybody
# with a credential could reach other services on this machine and anything
# else on its network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No multicast, ever.
no-multicast-peers

# The old, unauthenticated half of the protocol. Nothing here uses it.
no-cli
no-tcp-relay

# A data channel carrying a script and a few commands needs very little. This
# is generous for that and keeps one caller from saturating the machine.
user-quota=12
total-quota=100
bps-capacity=0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# journalctl -u coturn, rather than a file that grows without bound.
log-file=stdout
simple-log
