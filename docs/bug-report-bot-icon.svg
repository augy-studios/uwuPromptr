<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>uwuPromptr Bug Reports</title>
  <!-- The bug report bot's picture: uwuPromptr's prompter, with a bug on the screen
       where the script would be. Drawn smaller than the app icon so it survives
       Telegram's round crop. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2f5a2f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ccffcc"/>
  <g transform="translate(256 262) scale(0.8) translate(-256 -256)">
    <g filter="url(#shadow)">
      <!-- hood -->
      <polygon points="72,72 440,72 392,318 120,318" fill="#a79ba7"/>
      <polygon points="72,72 440,72 392,130 120,130" fill="#7a6d79"/>
      <!-- screen -->
      <rect x="136" y="130" width="224" height="188" fill="#85c7fe"/>
      <rect x="345" y="130" width="15" height="188" fill="#60b7ff"/>
      <!-- base and stand -->
      <polygon points="136,318 360,318 440,372 72,372" fill="#7a6d79"/>
      <rect x="72" y="372" width="368" height="30" fill="#a79ba7"/>
      <rect x="213" y="402" width="86" height="36" fill="#7a6d79"/>
    </g>
    <!-- the bug -->
    <g stroke="#4a3f49" stroke-linecap="round" fill="none">
      <path d="M240 172 Q226 150 214 148" stroke-width="5"/>
      <path d="M256 172 Q270 150 282 148" stroke-width="5"/>
      <path d="M210 214 L186 202" stroke-width="7"/>
      <path d="M206 240 L180 240" stroke-width="7"/>
      <path d="M210 266 L186 280" stroke-width="7"/>
      <path d="M286 214 L310 202" stroke-width="7"/>
      <path d="M290 240 L316 240" stroke-width="7"/>
      <path d="M286 266 L310 280" stroke-width="7"/>
    </g>
    <circle cx="213" cy="147" r="7" fill="#4a3f49"/>
    <circle cx="283" cy="147" r="7" fill="#4a3f49"/>
    <circle cx="248" cy="184" r="20" fill="#4a3f49"/>
    <ellipse cx="248" cy="244" rx="44" ry="52" fill="#ff6b81"/>
    <path d="M248 196 L248 294" stroke="#4a3f49" stroke-width="5" stroke-linecap="round"/>
    <circle cx="227" cy="226" r="9" fill="#4a3f49"/>
    <circle cx="269" cy="226" r="9" fill="#4a3f49"/>
    <circle cx="224" cy="262" r="7" fill="#4a3f49"/>
    <circle cx="272" cy="262" r="7" fill="#4a3f49"/>
    <circle cx="240" cy="180" r="4" fill="#ffffff"/>
    <circle cx="256" cy="180" r="4" fill="#ffffff"/>
    <!-- sparkles, as on the app icon -->
    <g fill="#fedc00" filter="url(#shadow)">
      <path d="M368 76 Q374 112 410 118 Q374 124 368 160 Q362 124 326 118 Q362 112 368 76 Z"/>
      <path d="M406 46 Q409 66 430 70 Q409 74 406 94 Q403 74 382 70 Q403 66 406 46 Z"/>
      <path d="M422 118 Q425 140 446 144 Q425 148 422 170 Q419 148 398 144 Q419 140 422 118 Z"/>
    </g>
  </g>
</svg>
